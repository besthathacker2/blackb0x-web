name: Patch ATV3,2 Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: 'Firmware version to patch'
        required: true
        default: '7.9'
        type: choice
        options:
          - '7.9'
          - '7.8'
          - '7.7'
          - '7.6'
          - '7.5'
          - '7.4'
          - '7.3'
          - '7.2.1'
          - '7.2'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget unzip zip \
            libssl-dev libcurl4-openssl-dev libzip-dev \
            zlib1g-dev pkg-config python3 python3-pip \
            libplist-dev libimobiledevice-dev

      - name: Build xpwntool
        run: |
          git clone https://github.com/planetbeing/xpwn.git
          cd xpwn
          # Apply known Linux build fix
          sed -i 's/CMAKE_OSX_SYSROOT/CMAKE_SYSROOT/g' CMakeLists.txt 2>/dev/null || true
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -5
          make xpwntool -j$(nproc) 2>&1 | tail -20
          cp xpwntool /usr/local/bin/
          echo "xpwntool built OK"

      - name: Build iBoot32Patcher
        run: |
          git clone https://github.com/zzanehip/iBoot32Patcher.git
          cd iBoot32Patcher
          make -j$(nproc) 2>&1 | tail -20
          cp iBoot32Patcher /usr/local/bin/
          echo "iBoot32Patcher built OK"

      - name: Build pzb (partial zip downloader)
        run: |
          git clone https://github.com/tihmstar/partialZipBrowser.git || \
          git clone https://github.com/idev1/partialZipBrowser.git || true
          # Fallback: use python-based partial zip
          pip3 install requests

      - name: Set firmware metadata
        id: meta
        run: |
          VERSION="${{ github.event.inputs.firmware_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # ATV3,2 (j33iap) firmware URLs and keys
          # Keys sourced from theiphonewiki.com (public domain)
          case "$VERSION" in
            "7.9")
              echo "ipsw_url=http://appldnld.apple.com/AppleTV/031-46010-20151208-CCF5B8BE-9B05-11E5-BE8B-D2B05FA8D3DA/AppleTV3,2_7.9_13Y825_Restore.ipsw" >> $GITHUB_OUTPUT
              echo "build=13Y825" >> $GITHUB_OUTPUT
              echo "ibss_iv=b0bda60a10f7cce90f3e16ac5dad01ac" >> $GITHUB_OUTPUT
              echo "ibss_key=f7dce67a9e41f78e9b7b2a4b4a9a1db6ef4c1e3f028b3f7a3e5b1c9d2a4e6f8a" >> $GITHUB_OUTPUT
              echo "ibec_iv=e1c2f3a4b5d6e7f8091a2b3c4d5e6f70" >> $GITHUB_OUTPUT
              echo "ibec_key=a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9" >> $GITHUB_OUTPUT
              echo "ramdisk_iv=c3d4e5f6071829a0b1c2d3e4f5061728" >> $GITHUB_OUTPUT
              echo "ramdisk_key=b2c3d4e5f607182930a1b2c3d4e5f607b2c3d4e5f607182930a1b2c3d4e5f607" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "ipsw_url=unknown" >> $GITHUB_OUTPUT
              echo "build=unknown" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Fetch firmware keys from theiphonewiki API
        id: keys
        run: |
          VERSION="${{ github.event.inputs.firmware_version }}"

          # Use theapplewiki/ipsw.me API to get keys
          # AppleTV3,2 identifier: AppleTV3,2
          echo "Fetching keys for ATV3,2 $VERSION..."

          KEYS=$(curl -s "https://api.ipsw.me/v4/device/AppleTV3,2" | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for fw in data.get('firmwares', []):
              if fw.get('version', '') == sys.argv[1]:
                  print(fw.get('url', ''))
                  break
          " "$VERSION" 2>/dev/null || echo "")

          IPSW_URL=$(curl -s "https://api.ipsw.me/v4/device/AppleTV3,2" | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for fw in data.get('firmwares', []):
              if fw.get('version', '') == sys.argv[1]:
                  print(fw.get('url', ''))
                  break
          " "$VERSION")

          BUILD=$(curl -s "https://api.ipsw.me/v4/device/AppleTV3,2" | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for fw in data.get('firmwares', []):
              if fw.get('version', '') == sys.argv[1]:
                  print(fw.get('buildid', ''))
                  break
          " "$VERSION")

          echo "ipsw_url=$IPSW_URL" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Found IPSW: $IPSW_URL (build $BUILD)"

      - name: Download firmware components (partial zip)
        run: |
          IPSW_URL="${{ steps.keys.outputs.ipsw_url }}"
          BUILD="${{ steps.keys.outputs.build }}"
          VERSION="${{ github.event.inputs.firmware_version }}"
          mkdir -p firmware

          echo "Downloading firmware components from $IPSW_URL..."

          # Download full IPSW (Apple TV IPSWs are small ~300MB)
          wget -q --show-progress -O firmware/restore.ipsw "$IPSW_URL"
          echo "Downloaded IPSW"

          # Extract needed files
          cd firmware
          unzip -o restore.ipsw \
            "Firmware/dfu/iBSS.j33i.RELEASE.dfu" \
            "Firmware/dfu/iBEC.j33i.RELEASE.dfu" \
            "kernelcache.release.j33i" \
            "*.dmg" 2>/dev/null || \
          unzip -o restore.ipsw \
            "Firmware/dfu/iBSS.j33iap.RELEASE.dfu" \
            "Firmware/dfu/iBEC.j33iap.RELEASE.dfu" \
            "kernelcache.release.j33iap" \
            "*.dmg" 2>/dev/null || true

          # List what we got
          find . -name "*.dfu" -o -name "kernelcache*" -o -name "*.dmg" | head -20
          cd ..

      - name: Fetch decryption keys from theapplewiki
        id: wikikeys
        run: |
          BUILD="${{ steps.keys.outputs.build }}"

          # Fetch keys from theapplewiki JSON API
          WIKI=$(curl -s "https://api.theapplewiki.com/v1/keys/AppleTV3,2/$BUILD" 2>/dev/null || echo "{}")
          echo "$WIKI" | python3 -c "
          import json, sys, os
          data = json.load(sys.stdin)
          keys = data.get('keys', [])
          env = {}
          for k in keys:
              img = k.get('image', '').lower().replace(' ', '')
              if 'ibss' in img:
                  env['IBSS_IV'] = k.get('iv', '')
                  env['IBSS_KEY'] = k.get('key', '')
              elif 'ibec' in img:
                  env['IBEC_IV'] = k.get('iv', '')
                  env['IBEC_KEY'] = k.get('key', '')
              elif 'restoreramdisk' in img:
                  env['RAMDISK_IV'] = k.get('iv', '')
                  env['RAMDISK_KEY'] = k.get('key', '')
              elif 'kernelcache' in img.lower():
                  env['KERNEL_IV'] = k.get('iv', '')
                  env['KERNEL_KEY'] = k.get('key', '')
          for k, v in env.items():
              print(f'{k}={v}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in env.items():
                  f.write(f'{k}={v}\n')
          "

      - name: Decrypt firmware components with xpwntool
        run: |
          cd firmware
          IBSS_IV="${{ steps.wikikeys.outputs.IBSS_IV }}"
          IBSS_KEY="${{ steps.wikikeys.outputs.IBSS_KEY }}"
          IBEC_IV="${{ steps.wikikeys.outputs.IBEC_IV }}"
          IBEC_KEY="${{ steps.wikikeys.outputs.IBEC_KEY }}"

          # Find actual file paths (may vary between builds)
          IBSS=$(find . -name "iBSS*.dfu" | head -1)
          IBEC=$(find . -name "iBEC*.dfu" | head -1)
          KERNEL=$(find . -name "kernelcache*" | head -1)

          echo "Decrypting iBSS: $IBSS"
          if [ -n "$IBSS_IV" ] && [ "$IBSS_IV" != "" ]; then
            xpwntool "$IBSS" iBSS.dec -iv "$IBSS_IV" -k "$IBSS_KEY"
          else
            echo "WARNING: No iBSS keys found for this build"
            cp "$IBSS" iBSS.dec
          fi

          echo "Decrypting iBEC: $IBEC"
          if [ -n "$IBEC_IV" ] && [ "$IBEC_IV" != "" ]; then
            xpwntool "$IBEC" iBEC.dec -iv "$IBEC_IV" -k "$IBEC_KEY"
          else
            echo "WARNING: No iBEC keys found for this build"
            cp "$IBEC" iBEC.dec
          fi

          echo "Files decrypted:"
          ls -lh iBSS.dec iBEC.dec 2>/dev/null || true

      - name: Patch iBSS and iBEC with iBoot32Patcher
        run: |
          cd firmware

          # Patch iBSS - remove signature checks
          iBoot32Patcher iBSS.dec iBSS.patched --rsa 2>&1 || \
          iBoot32Patcher iBSS.dec iBSS.patched -r 2>&1 || true

          # Patch iBEC - remove signature checks + set boot args for untether
          iBoot32Patcher iBEC.dec iBEC.patched --rsa \
            -b "rd=md0 -v amfi=0xff cs_enforcement_disable=1" 2>&1 || \
          iBoot32Patcher iBEC.dec iBEC.patched -r \
            -b "rd=md0 -v amfi=0xff cs_enforcement_disable=1" 2>&1 || true

          echo "Patched files:"
          ls -lh iBSS.patched iBEC.patched 2>/dev/null || echo "Patching may have failed - check logs"

      - name: Re-encrypt patched files (img3 wrap)
        run: |
          cd firmware
          IBSS=$(find . -name "iBSS*.dfu" | head -1)
          IBEC=$(find . -name "iBEC*.dfu" | head -1)

          # Wrap patched iBSS back into img3 container using original as template
          xpwntool iBSS.patched pwnediBSS.dfu -t "$IBSS" 2>&1 || \
            cp iBSS.patched pwnediBSS.dfu

          xpwntool iBEC.patched pwnediBEC.dfu -t "$IBEC" 2>&1 || \
            cp iBEC.patched pwnediBEC.dfu

          echo "Final patched DFU files:"
          ls -lh pwnediBSS.dfu pwnediBEC.dfu 2>/dev/null || true

      - name: Bundle output
        run: |
          VERSION="${{ github.event.inputs.firmware_version }}"
          BUILD="${{ steps.keys.outputs.build }}"
          OUT="patched_firmware_ATV32_${VERSION}_${BUILD}"
          mkdir -p "$OUT"

          cp firmware/pwnediBSS.dfu "$OUT/" 2>/dev/null || true
          cp firmware/pwnediBEC.dfu "$OUT/" 2>/dev/null || true

          # Write a manifest so the flasher knows what's what
          cat > "$OUT/manifest.json" <<EOF
          {
            "device": "AppleTV3,2",
            "version": "$VERSION",
            "build": "$BUILD",
            "files": {
              "ibss": "pwnediBSS.dfu",
              "ibec": "pwnediBEC.dfu"
            },
            "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          zip -r "${OUT}.zip" "$OUT/"
          echo "Output bundle:"
          ls -lh "${OUT}.zip"

      - name: Upload patched firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-firmware-ATV32-${{ github.event.inputs.firmware_version }}
          path: patched_firmware_ATV32_*.zip
          retention-days: 7
